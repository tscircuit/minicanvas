name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-comparisons
          path: |
            tests/output/comparisons/*.png
            tests/snapshots/*.actual.png
            tests/snapshots/*.reference.png
